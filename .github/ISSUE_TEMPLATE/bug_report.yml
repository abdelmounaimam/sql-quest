name: Bug report
description: Something in the app is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18 / Windows, Chrome 131
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
